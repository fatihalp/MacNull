name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify release version
        run: |
          bash scripts/check-version-sync.sh
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and smoke-test the CLI
        run: |
          swift build
          swift run MacClean scan --module trash_bins

      - name: Build and verify the Apple silicon DMG
        run: |
          bash scripts/build-dmg.sh
          app=".build/dmg/MacNull.app"
          for binary in "$app/Contents/MacOS/MacClean" "$app/Contents/Library/LoginItems/MacCleanMenu.app/Contents/MacOS/MacCleanMenu"; do
            archs=$(lipo -archs "$binary")
            if [[ "$archs" != "arm64" ]]; then
              echo "::error::Expected arm64 only for $binary; found $archs"
              exit 1
            fi
          done
          codesign --verify --deep --strict "$app"
          hdiutil verify ".build/MacNull-${VERSION}.dmg"
          cd .build
          shasum -a 256 "MacNull-${VERSION}.dmg" > "MacNull-${VERSION}.dmg.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "MacNull $VERSION" \
            --notes "Requires a Mac with Apple silicon (arm64) and macOS 14 or later. The app is ad-hoc signed and has not been notarized by Apple." \
            ".build/MacNull-${VERSION}.dmg" ".build/MacNull-${VERSION}.dmg.sha256"
